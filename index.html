<title>Immersa Program Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap">
<style>
  :root{
    --teal:#31B3C2;
    --teal-strong:#1E8C99;
    --teal-soft:#E3F4F6;
    --ink:#123A40;
    --ink-2:#4B6A6F;
    --ground:#F3F8F8;
    --surface:#FFFFFF;
    --line:#D5E7E9;
    --sun:#FFD66B;
    --sun-ink:#5A4200;
    --on-teal:#FFFFFF;
    --shadow:0 18px 40px -24px rgba(18,58,64,.35);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme:dark;
      --teal:#45C3D1; --teal-strong:#6FD4DF; --teal-soft:#16373C;
      --ink:#E4F2F3; --ink-2:#9DB9BC; --ground:#0C1B1E; --surface:#12282C;
      --line:#23444A; --sun:#F2C85A; --sun-ink:#2B2000; --on-teal:#062226;
      --shadow:0 18px 40px -24px rgba(0,0,0,.7);
    }
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --teal:#45C3D1; --teal-strong:#6FD4DF; --teal-soft:#16373C;
    --ink:#E4F2F3; --ink-2:#9DB9BC; --ground:#0C1B1E; --surface:#12282C;
    --line:#23444A; --sun:#F2C85A; --sun-ink:#2B2000; --on-teal:#062226;
    --shadow:0 18px 40px -24px rgba(0,0,0,.7);
  }
  *{box-sizing:border-box}
  body{
    background:var(--ground); color:var(--ink);
    font-family:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
    font-size:17px; line-height:1.55;
    padding-inline:16px; padding-block:28px 48px;
  }
  .wrap{max-width:620px; margin:0 auto; display:flex; flex-direction:column; gap:22px}
  header{display:flex; justify-content:center}
  header img{width:220px; height:auto}
  h1,h2,h3,.display{font-family:"Poppins",system-ui,sans-serif; letter-spacing:-.01em; text-wrap:balance; margin:0}
  h1{font-size:clamp(1.7rem,5.4vw,2.35rem); line-height:1.15; font-weight:700}
  h2{font-size:clamp(1.3rem,4.2vw,1.6rem); line-height:1.25; font-weight:600}
  h3{font-size:1.05rem; font-weight:600}
  p{margin:0}
  .muted{color:var(--ink-2)}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:22px; padding:28px clamp(18px,4.5vw,34px); box-shadow:var(--shadow); display:flex; flex-direction:column; gap:20px}
  .eyebrow{font-size:.78rem; font-weight:700; text-transform:uppercase; letter-spacing:.09em; color:var(--teal-strong)}

  /* start screen: reduction demo */
  .sound{background:var(--teal-soft); border-radius:16px; padding:16px 18px; display:flex; flex-direction:column; gap:6px}
  .sound .written{font-size:.95rem; color:var(--ink-2)}
  .sound .spoken{font-family:"Poppins",sans-serif; font-weight:600; font-size:1.15rem; color:var(--teal-strong)}
  .sound .spoken span{opacity:.45; font-weight:500}
  .facts{display:flex; flex-wrap:wrap; gap:8px 18px; font-size:.92rem; color:var(--ink-2); padding:0; margin:0; list-style:none}
  .facts li{display:flex; gap:7px; align-items:center}
  .facts li::before{content:""; width:7px; height:7px; border-radius:50%; background:var(--teal)}

  button{font:inherit; cursor:pointer}
  .btn{background:var(--teal); color:var(--on-teal); border:0; border-radius:999px; padding:15px 26px; font-family:"Poppins",sans-serif; font-weight:600; font-size:1rem; display:inline-flex; justify-content:center; align-items:center; gap:10px; text-decoration:none; transition:transform .15s ease, background .15s ease}
  .btn:hover{background:var(--teal-strong)}
  .btn:active{transform:scale(.98)}
  .btn:disabled{opacity:.45; cursor:not-allowed}
  .btn.block{width:100%}
  .link{background:none; border:0; color:var(--ink-2); padding:6px 2px; font-weight:600; text-decoration:underline; text-underline-offset:3px}
  .link:hover{color:var(--ink)}
  :focus-visible{outline:3px solid var(--teal); outline-offset:3px}

  /* progress: the logo's dots */
  .progress{display:flex; align-items:center; justify-content:space-between; gap:12px}
  .dots{display:flex; gap:8px}
  .dots i{width:11px; height:11px; border-radius:50%; background:var(--line); transition:background .25s ease, transform .25s ease}
  .dots i.done{background:var(--teal)}
  .dots i.now{background:var(--teal); transform:scale(1.35)}
  .count{font-size:.85rem; color:var(--ink-2); font-variant-numeric:tabular-nums}

  .options{display:flex; flex-direction:column; gap:10px}
  .opt{width:100%; text-align:left; background:var(--surface); color:var(--ink); border:1.5px solid var(--line); border-radius:16px; padding:15px 18px; display:flex; gap:14px; align-items:flex-start; line-height:1.4; transition:border-color .15s ease, background .15s ease}
  .opt:hover{border-color:var(--teal)}
  .opt .radio{flex:none; width:20px; height:20px; border-radius:50%; border:2px solid var(--line); margin-top:1px; display:grid; place-items:center}
  .opt[aria-pressed="true"]{border-color:var(--teal); background:var(--teal-soft)}
  .opt[aria-pressed="true"] .radio{border-color:var(--teal)}
  .opt[aria-pressed="true"] .radio::after{content:""; width:10px; height:10px; border-radius:50%; background:var(--teal)}
  .hint{font-size:.9rem; color:var(--ink-2)}
  .sub{font-weight:400; font-size:.72em; color:var(--ink-2)}
  .pickhint{font-size:.92rem; font-weight:700; color:var(--teal-strong); margin-top:-6px}
  .opt.multi .radio{border-radius:6px}
  .opt.multi[aria-pressed="true"] .radio::after{border-radius:2px}
  .opt[aria-disabled="true"]{opacity:.45; cursor:not-allowed}
  .opt[aria-disabled="true"]:hover{border-color:var(--line)}
  .navrow{display:flex; justify-content:space-between; align-items:center; gap:12px; min-height:44px}

  /* form */
  form{display:flex; flex-direction:column; gap:14px}
  label{font-weight:600; font-size:.95rem; display:flex; flex-direction:column; gap:6px}
  input[type=text],input[type=email]{font:inherit; color:var(--ink); background:var(--ground); border:1.5px solid var(--line); border-radius:12px; padding:13px 14px; width:100%}
  input:focus{border-color:var(--teal); outline:none}
  .check{flex-direction:row; align-items:flex-start; gap:10px; font-weight:400; font-size:.9rem; color:var(--ink-2)}
  .check input{margin-top:4px; accent-color:var(--teal); width:18px; height:18px; flex:none}
  .err{color:#C2412F; font-size:.88rem; font-weight:600}
  .fine{font-size:.82rem; color:var(--ink-2)}

  /* result */
  .result-top{display:flex; flex-direction:column; gap:24px}
  .pname{font-family:"Poppins",sans-serif; font-weight:700; font-size:clamp(2.4rem,9vw,3.2rem); line-height:1; color:var(--teal-strong); letter-spacing:-.02em}
  .mirror{border-left:3px solid var(--teal); padding-left:14px; color:var(--ink-2); font-style:italic}
  .includes{list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:9px}
  .includes li{display:flex; gap:11px; align-items:flex-start}
  .includes li::before{content:""; flex:none; width:8px; height:8px; margin-top:.55em; border-radius:50%; background:var(--teal)}
  .price{display:flex; flex-direction:column; gap:10px; background:var(--teal-soft); border-radius:16px; padding:18px}
  .price-row{display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 12px}
  .amount{font-family:"Poppins",sans-serif; font-weight:700; font-size:2rem; font-variant-numeric:tabular-nums}
  .amount small{font-size:1rem; font-weight:500; color:var(--ink-2)}
  .was{text-decoration:line-through; color:var(--ink-2); font-variant-numeric:tabular-nums}
  .badge{display:inline-block; background:var(--sun); color:var(--sun-ink); font-weight:700; font-size:.78rem; letter-spacing:.04em; text-transform:uppercase; padding:4px 10px; border-radius:999px; width:fit-content}
  .value{font-size:.92rem; color:var(--ink-2)}
  .alt{border-top:1px solid var(--line); padding-top:18px; display:flex; flex-direction:column; gap:8px; font-size:.95rem}
  .alt a{color:var(--teal-strong); font-weight:700}
  .lead-in{font-size:1.05rem; font-weight:600; color:var(--ink-2)}
  .was{font-size:1.3rem; font-weight:600}
  .faq{display:flex; flex-direction:column; margin-top:56px; padding-top:28px; border-top:1px solid var(--line)}
  .faq h3{margin-bottom:6px}
  .faq details{border-bottom:1px solid var(--line)}
  .faq summary{cursor:pointer; list-style:none; padding:14px 30px 14px 0; font-weight:700; position:relative}
  .faq summary::-webkit-details-marker{display:none}
  .faq summary::after{content:"+"; position:absolute; right:4px; top:50%; transform:translateY(-50%); font-family:"Poppins",sans-serif; font-size:1.3rem; color:var(--teal-strong)}
  .faq details[open] summary::after{content:"–"}
  .faq .ans{padding:0 0 16px; color:var(--ink-2)}
  .faq .ans a{color:var(--teal-strong); font-weight:700}
  .sign{font-family:"Poppins",system-ui,sans-serif; font-weight:600; color:var(--teal-strong)}
  .lives{display:flex; flex-direction:column; gap:10px}
  .live{display:flex; align-items:center; gap:12px; padding:14px 16px; border:1.5px solid var(--line); border-radius:14px; color:var(--ink); font-weight:700; text-decoration:none; transition:border-color .15s ease, background .15s ease}
  .live:hover{border-color:var(--teal); background:var(--teal-soft)}
  .live-dot{width:10px; height:10px; border-radius:50%; background:var(--teal); flex:none}
  .thanks{font-family:"Poppins",system-ui,sans-serif; font-weight:600; font-size:1.15rem}
  .defn{font-weight:600; font-size:1.02rem; background:var(--teal-soft); border-radius:14px; padding:14px 16px}
  .deadline{font-weight:700; color:var(--teal-strong); margin-top:-4px}
  .price{align-self:center; max-width:100%; align-items:center; text-align:center}
  .price .price-row{justify-content:center}
  .cta{align-self:center; max-width:100%; text-align:center}
  .fine{text-align:center}
  .step-result, .step-notfit, .step-young{gap:32px}
  .result-top .lead-in{margin-bottom:-16px}
  .step-result p, .step-notfit p, .step-young p{line-height:1.65}
  .h1-sub{display:block; font-size:.6em; font-weight:500; color:var(--teal-strong); margin-top:6px}
  footer{text-align:center; font-size:.82rem; color:var(--ink-2)}

  .screen{animation:rise .35s ease both}
  @keyframes rise{from{transform:translateY(8px)}to{transform:none}}
  @media (prefers-reduced-motion: reduce){ .screen{animation:none} *{transition:none!important} }
</style>

    ]

  {
    id:"experience",
    q:"¿Tienes experiencia hablando en inglés?",
    options:[
      {t:"No, todavía no he tenido conversaciones en inglés.", talk:"never"},

/* Google Analytics: solo funciona en la versión publicada (quiz.immersa.com.co) */
function track(name, params){ try { if (typeof window.gtag === "function") window.gtag("event", name, params || {}); } catch(e){} }
let lastTracked = "";
function trackEnd(){
  let label = "";
  if (state.step === "result") label = "conversemos";

  if (label && label !== lastTracked){ lastTracked = label; track("quiz_resultado", {resultado: label}); }

}

function viewQuestion(){

}

    <span class="eyebrow">Gracias por contarme cómo vas</span>
    <h2>🥹 My dear student, me encantaría acompañarte, pero todavía no es el momento</h2>
    <p>Antes que nada, quiero decirte algo: que estés aquí buscando cómo avanzar con tu inglés dice mucho de tus ganas de aprender, y eso es lo más importante.</p>
    <p>Mis programas están diseñados para ayudarte a desbloquear tu speaking. Para lograrlo, es importante que ya tengas una base de vocabulario y un poco de experiencia hablando. Si entraras ahora, sentiría que te estoy pidiendo correr antes de caminar, y no quiero que te frustres ni que sientas que no avanzas.</p>
    <p>Por eso, creo que primero te vendría mejor seguir fortaleciendo tu base de vocabulario, y más adelante, cuando tengas más rodaje y más porcentaje de comprensión en contenido en inglés, podríamos trabajar juntos.</p>
    <p>Siempre recomiendo que primero trabajes tu comprensión (vocabulario) y luego tu speaking. Si lo haces al revés o al tiempo, vas a generar bloqueos, porque tu cerebro aún no tiene la información necesaria para poder hablar.</p>
    <p>Te dejo un en vivo donde te doy recomendaciones puntuales para trabajar tu vocabulario.</p>
    <p>Una vez construyas tu vocabulario, vuelve a hacer este quiz. Aquí voy a estar. Me encantaría acompañarte.</p>
    <a class="live" href="https://www.instagram.com/reel/C3oYE0DNUnw/" target="_blank" rel="noopener"><span class="live-dot" aria-hidden="true"></span>Ver el en vivo en Instagram</a>
    <p class="sign">Teacher Isa</p>
    <div class="navrow">
      <button class="link" data-act="back">Cambiar mis respuestas</button>
      <button class="btn" data-act="restart">Volver al inicio</button>
    </div>`;
}

/* ========= RESULTADO ========= */
function joinPlaces(list){
  if (!list.length) return "";
  if (list.length === 1) return list[0];
  return list.slice(0,-1).join(", ") + " y " + list[list.length-1];
}
function profile(){
  const pct  = pick("comprehension")?.pct || 50;
  const talk = pick("experience")?.talk || "never";
  const places = (pick("situations") || []).filter(o => o.place);
  const onlyClass = places.length > 0 && places.every(o => o.place === "en clases");
  const atWork = places.some(o => o.place === "en tu trabajo");
  const real = joinPlaces(places.filter(o => o.place !== "en clases").map(o => o.place));

  // 1. Dónde está (comprensión + cómo le va hablando)
  const ending = {
    never: `.`,
    short: ` (o simplemente respondas con frases cortas).`,
    yes:   ` en medio de una conversación.`,
    often: `. Y aunque ya hablas, sientes que en inglés todavía no suenas como tú.`,
  }[talk] || `.`;
  const punto = pct >= 70
    ? `Veo que estás en el punto en el que ya entiendes casi todo, pero entender no es lo mismo que hablar. Tu cerebro todavía no ha activado todo el vocabulario que tienes guardado, y por eso puede que te bloquees, que las palabras no te salgan a tiempo o que te quedes en blanco${ending}`
    : `Veo que estás en el punto en el que ya logras entender la idea general de lo que lees o escuchas, pero aún no logras hablar como quisieras. Todavía no has soltado la lengua: tu cerebro aún no ha activado todas las palabras que conoces, y por eso puede que te bloquees, que se te vaya el vocabulario justo cuando quieres hablar o que te quedes en blanco${ending}`;

  // 2. Dónde lo quiere usar
  let meta;
  if (atWork)
    meta = `Como ya te ha tocado usar el inglés en tu trabajo, sé lo importante que es para ti aumentar tu confianza cuando debes hablar frente a tu equipo. Ahí no hay tiempo para traducir en tu cabeza, y por eso es clave que el inglés te salga de forma natural.`;
  else if (onlyClass)
    meta = `Como hasta ahora solo has usado el inglés en clase, ya es momento de llevarlo a la vida real, porque sé que tu objetivo es hablarlo fuera de un salón.`;
  else if (places.length)
    meta = `Como ya has usado el inglés ${real}, sabes lo que se siente tener que responder en el momento. Es hora de que esas conversaciones se sientan fáciles y naturales.`;
  else
    meta = `Sé que tu objetivo es empezar a hablarlo de verdad, y lo mejor es hacerlo con guía, en un espacio seguro donde equivocarte está bien.`;

  return { punto, meta };
}

function viewResult(){
  const p = profile();
  return `
    <span class="eyebrow">Tu resultado</span>
    <h2>🎉 My dear student, ¡sí podemos trabajar juntos!</h2>
    <p class="thanks">Gracias por contarme un poquito de tu proceso 💙</p>
    <p>✨ ${p.punto}</p>
    <p>🌍 ${p.meta}</p>
    <p>🚀 Me encantaría ayudarte a lograrlo en uno de mis programas: Fluency o Clarity. Cuéntame un poquito más de ti y te digo cuál es mejor para ti 👇</p>
    <a class="btn cta" data-track="whatsapp" href="${CONFIG.whatsappUrl}" target="_blank" rel="noopener">💬 Quiero conversar</a>
    <div class="alt">
      <button class="link" data-act="restart" style="align-self:flex-start">Hacer el quiz de nuevo</button>
    </div>`;
}

/* ========= EVENTOS ========= */
function bind(){
  app.querySelectorAll("[data-opt]").forEach(btn=>btn.addEventListener("click",()=>{
    const q = QUESTIONS[state.i];
    const k = +btn.dataset.opt;
    if (q.max){
      const cur = state.answers[q.id] || [];
      const isNone = q.options[k].none;
      if (cur.includes(k)) state.answers[q.id] = cur.filter(x=>x!==k);
      else if (isNone) state.answers[q.id] = [k];                                  // "Todavía no" va sola
      else {
        const rest = cur.filter(x => !q.options[x].none);
        if (rest.length < q.max) state.answers[q.id] = [...rest, k];
      }
      render(); return;
    }
    state.answers[q.id] = k;
    render();   // se avanza siempre con "Siguiente"
  }));
  app.querySelectorAll("a[data-track]").forEach(a=>a.addEventListener("click",()=>track("clic_whatsapp")));
  app.querySelectorAll("[data-act]").forEach(btn=>btn.addEventListener("click",()=>{
    const a = btn.dataset.act;
    if (a==="begin"){ track("quiz_iniciado"); state.step="q"; state.i=0; render(); }
    else if (a==="next") advance();
    else if (a==="back"){
      if (state.step==="notfit"){ state.step="q"; state.i=QUESTIONS.length-1; }
      else if (state.i===0) state.step="start"; else state.i--;
      render();
    }
    else if (a==="restart"){ Object.assign(state,{step:"start", i:0, answers:{}}); render(); }
  }));
}
function advance(){
  if (state.i < QUESTIONS.length-1){ state.i++; }
  // Al final: con menos de 50% de comprensión, todavía no es el momento
  else { state.step = (pick("comprehension")?.pct ?? 100) < 50 ? "notfit" : "result"; }
  render();
}

render();
</script>
